    <title>Mega Canais TV</title>
    <script>
      // Ocultar o aviso de "produção" do Tailwind CDN para limpar o console
      (function() {
        var originalWarn = console.warn;
        console.warn = function(...args) {
          if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) {
            return;
          }
          originalWarn.apply(console, args);
        };
      })();

      // Google Cast Initialization Callback
      window['__onGCastApiAvailable'] = function(isAvailable) {
        if (isAvailable) {
          window.dispatchEvent(new Event('google-cast-ready'));
        }
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#ef4444', // Red-500 equivalent for branding
              dark: '#0f172a',    // Slate-900
              card: '#1e293b',    // Slate-800
            }
          }
        }
      }
    </script>
    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */

          scrollbar-width: none;  /* Firefox */
      }
    </style>
